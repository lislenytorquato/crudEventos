#JDBC

 spring:
  application:
   name: eventos
 datasource:
  url: jdbc:postgresql://localhost:5432/eventos-db
  username: eventos
  password: eventos

#JPA/Hibernate

 jpa:
  hibernate:
   ddl-auto: none
  properties:
   hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
  show-sql: true


#Flyway

 flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
